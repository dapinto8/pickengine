[project]
name = "pickengine"
version = "0.1.0"
description = "MLB-first sports betting prediction engine and backtester"
readme = "README.md"
authors = [
    { name = "David Pinto", email = "davidpinto999@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.1",
]

[project.scripts]
pickengine = "pickengine.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
